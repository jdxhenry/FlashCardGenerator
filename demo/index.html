<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FlashCard Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:wght@400;700&family=Merriweather:wght@400;700&family=Space+Grotesk:wght@400;600;700&family=Lora:ital,wght@0,400;0,700;1,400&family=DM+Serif+Display:ital@0;1&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: "#6366f1" },
          fontFamily: {
            display: ["Inter","sans-serif"],
            serif:   ["Merriweather","serif"],
            mono:    ["Roboto Mono","monospace"],
            elegant: ["Playfair Display","serif"],
            grotesk: ["Space Grotesk","sans-serif"],
            lora:    ["Lora","serif"],
            dm:      ["DM Serif Display","serif"],
            syne:    ["Syne","sans-serif"],
          }
        }
      }
    }
  </script>
  <style>
    body { min-height:100dvh; }

    .aspect-1-1  { aspect-ratio:1/1;  }
    .aspect-3-4  { aspect-ratio:3/4;  }
    .aspect-4-3  { aspect-ratio:4/3;  }
    .aspect-16-9 { aspect-ratio:16/9; }
    .aspect-9-16 { aspect-ratio:9/16; }

    .scrollbar-hide::-webkit-scrollbar { display:none; }
    .scrollbar-hide { -ms-overflow-style:none; scrollbar-width:none; }

    /* ── nav arrows (original) ── */
    .nav-btn {
      position:absolute; top:50%; transform:translateY(-50%);
      padding:10px; border-radius:9999px;
      background:rgba(0,0,0,0.28); backdrop-filter:blur(8px);
      color:white; opacity:0; transition:opacity .25s;
      z-index:20; cursor:pointer; border:none; display:none;
    }
    .has-multi .nav-btn { display:block !important; }
    .has-multi #cardWrap:hover .nav-btn { opacity:.7; }
    .has-multi #cardWrap:hover .nav-btn:hover { opacity:1; }

    /* ── logo overlay ── */
    #logoOv {
      position:absolute; cursor:grab; user-select:none;
      z-index:15; touch-action:none; display:none;
    }
    #logoOv:active { cursor:grabbing; }
    #logoOv img { display:block; border-radius:4px; }
    .logo-rz {
      position:absolute; bottom:-6px; right:-6px;
      width:13px; height:13px; background:white;
      border:2px solid #6366f1; border-radius:3px; cursor:se-resize;
    }

    /* ════════════════════════════════════════
       FLOATING BUBBLE PICKER  (original style)
       sits at very bottom, never blocks card
    ════════════════════════════════════════ */
    #picker {
      position:fixed; inset:0; z-index:50;
      display:none; align-items:flex-end;
      pointer-events:none;
      background:rgba(0,0,0,0.42);
    }
    #picker.show {
      display:flex;
      pointer-events:all;
    }
    #pickerWrap {
      width:100%; pointer-events:all;
      padding-bottom:80px; /* clears toolbar */
    }
    #pickerScroll {
      overflow-x:auto; white-space:nowrap;
      padding:14px 20px 6px;
      scrollbar-width:none;
    }
    #pickerScroll::-webkit-scrollbar { display:none; }
    #pickerItems { display:inline-flex; gap:14px; align-items:center; }

    /* bubble */
    .bubble {
      width:52px; height:52px; border-radius:50%;
      flex-shrink:0; cursor:pointer;
      border:3px solid transparent;
      display:flex; align-items:center; justify-content:center;
      transition:transform .15s, box-shadow .15s;
      position:relative;
      box-shadow:0 3px 14px rgba(0,0,0,.35);
    }
    .bubble:hover { transform:scale(1.14); }
    .bubble.sel {
      border-color:white;
      box-shadow:0 0 0 2px white, 0 0 0 5px rgba(255,255,255,.6), 0 3px 16px rgba(0,0,0,.4);
    }
    .bubble.sel::after {
      content:'✓'; color:white; font-size:18px; font-weight:900;
      text-shadow:0 1px 4px rgba(0,0,0,.6);
    }
    /* label bubble (for font name, aspect, border width) */
    .bubble.lbl {
      background:rgba(255,255,255,.18) !important;
      backdrop-filter:blur(10px);
      border:2px solid rgba(255,255,255,.35) !important;
      font-family:'Space Grotesk',sans-serif;
      font-size:10px; font-weight:700; color:white;
      line-height:1.2; text-align:center; padding:4px;
      box-shadow:0 2px 10px rgba(0,0,0,.28);
    }

    /* slider row that can appear inside the picker area */
    #pickerExtra {
      padding:0 24px 8px;
      display:none;
    }
    #pickerExtra.show { display:block; }
    #pickerExtra label {
      font-size:10px; font-weight:700; color:rgba(255,255,255,.7);
      font-family:'Space Grotesk',sans-serif;
      display:block; margin-bottom:4px;
    }
    #pickerExtra input[type=range] {
      -webkit-appearance:none; width:100%; height:5px;
      border-radius:3px; background:rgba(255,255,255,.3); outline:none;
    }
    #pickerExtra input[type=range]::-webkit-slider-thumb {
      -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
      background:white; cursor:pointer;
    }

    /* ════════════════════════════════════════
       EDIT SHEET — compact text editor
       slides up just enough, card stays visible
    ════════════════════════════════════════ */
    #editSheet {
      position:fixed; left:0; right:0; bottom:0;
      z-index:50;
      background:white;
      border-radius:22px 22px 0 0;
      box-shadow:0 -4px 30px rgba(99,102,241,.2);
      transform:translateY(100%);
      transition:transform .28s cubic-bezier(.4,0,.2,1);
      /* max-height caps it so card above is still visible */
      max-height:48vh;
      display:flex; flex-direction:column;
    }
    #editSheet.open { transform:translateY(0); }

    .es-grip {
      flex-shrink:0; height:16px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
    }
    .es-grip::after {
      content:''; width:36px; height:4px;
      background:#d1d5db; border-radius:9px;
    }
    .es-head {
      flex-shrink:0;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 16px 10px;
      border-bottom:1px solid #f3f4f6;
    }
    .es-head h3 {
      font-size:14px; font-weight:800; color:#1e1b4b;
      font-family:'Space Grotesk',sans-serif;
    }
    .es-done {
      padding:6px 18px; border-radius:20px;
      background:#6366f1; color:white;
      font-weight:700; font-size:12px; border:none; cursor:pointer;
      font-family:'Space Grotesk',sans-serif;
    }
    .es-body {
      flex:1; overflow-y:auto; padding:10px 16px 16px;
      -webkit-overflow-scrolling:touch;
    }
    .es-body::-webkit-scrollbar { width:3px; }
    .es-body::-webkit-scrollbar-thumb { background:#e5e3ff; border-radius:3px; }

    .es-body textarea {
      width:100%; padding:10px 12px; border-radius:12px;
      background:#f8f7ff; border:1.5px solid #e5e3ff;
      font-size:14px; color:#1e1b4b; outline:none; resize:none;
      font-family:'Space Grotesk',sans-serif; line-height:1.55;
      transition:border-color .16s; min-height:80px;
    }
    .es-body textarea:focus { border-color:#6366f1; }
    .es-body input[type=text] {
      width:100%; padding:9px 12px; border-radius:12px; margin-top:8px;
      background:#f8f7ff; border:1.5px solid #e5e3ff;
      font-size:13px; color:#1e1b4b; outline:none;
      font-family:'Space Grotesk',sans-serif;
      transition:border-color .16s;
    }
    .es-body input[type=text]:focus { border-color:#6366f1; }

    /* ── Logo mini sheet ── */
    #logoSheet {
      position:fixed; left:0; right:0; bottom:0;
      z-index:50;
      background:white; border-radius:22px 22px 0 0;
      box-shadow:0 -4px 30px rgba(99,102,241,.2);
      transform:translateY(100%);
      transition:transform .28s cubic-bezier(.4,0,.2,1);
      max-height:44vh;
      display:flex; flex-direction:column;
    }
    #logoSheet.open { transform:translateY(0); }
    .ls-body { flex:1; overflow-y:auto; padding:10px 16px 20px; -webkit-overflow-scrolling:touch; }
    .up-area {
      border:2px dashed #e5e3ff; border-radius:14px;
      padding:20px; text-align:center; cursor:pointer;
      background:#f8f7ff; transition:border-color .16s;
    }
    .up-area:active { border-color:#6366f1; }
    .ls-sl { display:flex; align-items:center; gap:8px; margin-top:10px; }
    .ls-sl-i { font-size:14px; color:#9ca3af; flex-shrink:0; }
    .ls-sl input[type=range] {
      -webkit-appearance:none; flex:1; height:5px;
      border-radius:3px; background:#e5e3ff; outline:none;
    }
    .ls-sl input[type=range]::-webkit-slider-thumb {
      -webkit-appearance:none; width:17px; height:17px; border-radius:50%;
      background:#6366f1; cursor:pointer;
    }
    .pos-grid {
      display:grid; grid-template-columns:repeat(3,1fr); gap:5px;
      margin-top:10px; background:#f8f7ff; border-radius:12px;
      padding:8px; border:1.5px solid #e5e3ff;
    }
    .pos-btn {
      height:32px; border-radius:7px;
      border:1.5px solid #e5e3ff; background:white;
      cursor:pointer; position:relative; transition:all .12s;
    }
    .pos-btn:active { border-color:#6366f1; background:#ede9fe; }
    .pdot { width:5px; height:5px; border-radius:50%; background:#6366f1; position:absolute; }
    .rmv-btn {
      width:100%; padding:10px; border-radius:12px; margin-top:10px;
      border:1.5px solid #fecaca; background:#fff5f5;
      color:#ef4444; font-weight:700; font-size:13px;
      cursor:pointer; font-family:'Space Grotesk',sans-serif;
    }
    .ls-lbl {
      font-size:9px; font-weight:800; color:#9ca3af;
      text-transform:uppercase; letter-spacing:.08em;
      display:flex; align-items:center; gap:8px; margin:10px 0 6px;
    }
    .ls-lbl::after { content:''; flex:1; height:1px; background:#e5e7eb; }
  </style>
</head>
<body class="bg-gray-100 flex flex-col" style="background:#f0efff;">

<!-- ════════════════ PREVIEW ════════════════ -->
<main class="flex-1 flex flex-col items-center justify-center p-6 pb-24 pt-8">
  <div id="cardWrap" class="relative max-w-sm w-full">
    <div id="cardPreview"
         class="relative w-full rounded-3xl shadow-2xl overflow-hidden aspect-3-4"
         style="border:4px solid transparent; box-shadow:0 16px 56px rgba(99,102,241,.28),0 4px 12px rgba(0,0,0,.1);">

      <div id="bgLayer" class="absolute inset-0"
           style="background:linear-gradient(135deg,#7c3aed,#c026d3);"></div>
      <div class="absolute inset-0 pointer-events-none"
           style="background:rgba(255,255,255,0.07); z-index:2;"></div>

      <!-- text content -->
      <div id="cardContent"
           class="absolute inset-0 z-10 flex flex-col items-center justify-center px-7 py-10 text-center">
        <h1 id="previewTitle"
            class="font-bold leading-tight font-elegant text-5xl text-white"
            style="word-break:break-word;"></h1>
        <div id="previewDivider"
             style="width:40px;height:3px;border-radius:9px;background:rgba(255,255,255,.5);margin:10px auto;display:none;"></div>
        <p id="previewContent"
           class="mt-4 font-medium leading-relaxed font-display text-white text-lg"
           style="word-break:break-word;"></p>
      </div>

      <!-- watermark -->
      <div id="wmEl"
           style="position:absolute;bottom:12px;left:12px;z-index:12;opacity:.5;color:white;font-size:13px;font-weight:700;pointer-events:none;display:none;"></div>

      <!-- logo -->
      <div id="logoOv">
        <img id="logoImg" src="" alt="" style="width:70px;"/>
        <div class="logo-rz" id="logoRz"></div>
      </div>

      <!-- counter -->
      <div id="counter"
           style="position:absolute;top:10px;right:10px;z-index:20;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);color:white;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;pointer-events:none;display:none;font-family:'Space Grotesk',sans-serif;"></div>

      <!-- nav arrows -->
      <button id="prevBtn" class="nav-btn" style="left:8px;">
        <span class="material-symbols-outlined" style="font-size:26px;">chevron_left</span>
      </button>
      <button id="nextBtn" class="nav-btn" style="right:8px;">
        <span class="material-symbols-outlined" style="font-size:26px;">chevron_right</span>
      </button>

      <!-- download -->
      <button id="dlBtn"
              style="position:absolute;bottom:12px;right:12px;z-index:20;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);box-shadow:0 4px 18px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;transition:transform .13s;">
        <span class="material-symbols-outlined" style="font-size:22px;color:#6366f1;">download</span>
      </button>
    </div>

    <!-- dot indicators -->
    <div id="dots" style="display:flex;gap:6px;justify-content:center;margin-top:10px;min-height:10px;"></div>
  </div>
</main>

<!-- ════════════════ TOOLBAR ════════════════ -->
<div style="position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,0.88);backdrop-filter:blur(20px) saturate(180%);border-top:1px solid rgba(99,102,241,.12);box-shadow:0 -3px 20px rgba(99,102,241,.1);">
  <div style="max-width:520px;margin:0 auto;padding:6px 8px 10px;display:flex;justify-content:space-around;align-items:center;">

    <button data-a="ratio"   class="tb-btn">
      <span class="material-symbols-outlined">aspect_ratio</span>
      <span>Ratio</span>
    </button>
    <button data-a="text"    class="tb-btn">
      <span class="material-symbols-outlined">edit_note</span>
      <span>Text</span>
    </button>
    <button data-a="font"    class="tb-btn">
      <span class="material-symbols-outlined">text_fields</span>
      <span>Font</span>
    </button>
    <button data-a="color"   class="tb-btn">
      <span class="material-symbols-outlined">palette</span>
      <span>Color</span>
    </button>
    <button data-a="bg"      class="tb-btn">
      <span class="material-symbols-outlined">gradient</span>
      <span>BG</span>
    </button>
    <button data-a="border"  class="tb-btn">
      <span class="material-symbols-outlined">border_outer</span>
      <span>Border</span>
    </button>
    <button data-a="logo"    class="tb-btn">
      <span class="material-symbols-outlined">add_photo_alternate</span>
      <span>Logo</span>
    </button>
    <button data-a="new"     class="tb-btn" style="color:#6366f1;">
      <span class="material-symbols-outlined">add_card</span>
      <span>New</span>
    </button>

  </div>
</div>

<style>
  .tb-btn {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    color:#64748b; background:none; border:none; cursor:pointer;
    padding:5px 6px; border-radius:9px; transition:color .14s; flex:1;
    font-family:'Space Grotesk',sans-serif;
  }
  .tb-btn:hover { color:#6366f1; }
  .tb-btn .material-symbols-outlined { font-size:21px; }
  .tb-btn span:last-child { font-size:8.5px; font-weight:700; letter-spacing:.03em; }
</style>

<!-- ════════════════ FLOATING BUBBLE PICKER ════════════════ -->
<div id="picker">
  <div id="pickerWrap">
    <div id="pickerExtra">
      <label id="extraLabel">Size</label>
      <input type="range" id="extraSlider" min="10" max="72" value="36"/>
    </div>
    <div id="pickerScroll" class="scrollbar-hide">
      <div id="pickerItems"></div>
    </div>
  </div>
</div>

<!-- ════════════════ EDIT SHEET (compact text editor) ════════════════ -->
<div id="editSheet">
  <div class="es-grip" id="esGrip"></div>
  <div class="es-head">
    <h3>✏️ Edit Text</h3>
    <button class="es-done" id="esDone">Done</button>
  </div>
  <div class="es-body">
    <textarea id="esTitle" rows="2" placeholder="Title / heading…"></textarea>
    <textarea id="esContent" rows="3" placeholder="Body content…" style="margin-top:8px;"></textarea>
    <input type="text" id="esWm" placeholder="@watermark (optional)"/>
    <label style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer;">
      <input type="checkbox" id="esDivider" style="width:14px;height:14px;accent-color:#6366f1;"/>
      <span style="font-size:12px;color:#1e1b4b;font-family:'Space Grotesk',sans-serif;">Divider line between title &amp; content</span>
    </label>
  </div>
</div>

<!-- ════════════════ LOGO SHEET (compact) ════════════════ -->
<div id="logoSheet">
  <div class="es-grip" id="lsGrip"></div>
  <div class="es-head">
    <h3>🖼 Logo / Image</h3>
    <button class="es-done" id="lsDone">Done</button>
  </div>
  <div class="ls-body">
    <div class="up-area" id="upArea">
      <span class="material-symbols-outlined" style="font-size:28px;color:#9ca3af;display:block;margin-bottom:4px;">upload_file</span>
      <p style="font-size:12px;font-weight:600;color:#9ca3af;">Tap to upload logo</p>
      <p style="font-size:10px;color:#d1d5db;margin-top:2px;">PNG · JPG · SVG · WebP</p>
      <input type="file" id="logoFile" accept="image/*" style="display:none;"/>
    </div>

    <div class="ls-lbl">Size</div>
    <div class="ls-sl">
      <span class="material-symbols-outlined ls-sl-i">photo_size_select_small</span>
      <input type="range" id="logoSzSl" min="20" max="200" value="70"/>
      <span class="material-symbols-outlined ls-sl-i">photo_size_select_large</span>
    </div>

    <div class="ls-lbl">Quick Position</div>
    <div class="pos-grid">
      <button class="pos-btn" data-p="tl"><span class="pdot" style="top:3px;left:3px;"></span></button>
      <button class="pos-btn" data-p="tc"><span class="pdot" style="top:3px;left:50%;transform:translateX(-50%);"></span></button>
      <button class="pos-btn" data-p="tr"><span class="pdot" style="top:3px;right:3px;"></span></button>
      <button class="pos-btn" data-p="ml"><span class="pdot" style="top:50%;transform:translateY(-50%);left:3px;"></span></button>
      <button class="pos-btn" data-p="mc"><span class="pdot" style="top:50%;left:50%;transform:translate(-50%,-50%);"></span></button>
      <button class="pos-btn" data-p="mr"><span class="pdot" style="top:50%;transform:translateY(-50%);right:3px;"></span></button>
      <button class="pos-btn" data-p="bl"><span class="pdot" style="bottom:3px;left:3px;"></span></button>
      <button class="pos-btn" data-p="bc"><span class="pdot" style="bottom:3px;left:50%;transform:translateX(-50%);"></span></button>
      <button class="pos-btn" data-p="br"><span class="pdot" style="bottom:3px;right:3px;"></span></button>
    </div>
    <p style="font-size:10px;color:#9ca3af;text-align:center;margin-top:6px;">Or drag logo directly on the card ↑</p>
    <button class="rmv-btn" id="rmvLogo" style="display:none;">🗑 Remove Logo</button>
  </div>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const mkCard = () => ({
  title:   "FlashCard Maker",
  content: "Enter your text, pick colors and fonts, then download!",
  watermark: "",
  font: "elegant",
  fontSize: 36,
  textColor: "#ffffff",
  align: "center",
  bold: true,
  italic: false,
  lineH: 1.45,
  bg: "vf",
  aspect: "aspect-3-4",
  bw: "4", bc: "transparent",
  divider: false,
  logo: null, lsz: 70, lx: 14, ly: 14,
});

let cards = [mkCard()], idx = 0;

// ─── GRADIENTS ───────────────────────────────────────────────────────────────
const GR = {
  vf:"linear-gradient(135deg,#7c3aed,#c026d3)",
  bc:"linear-gradient(135deg,#2563eb,#06b6d4)",
  ro:"linear-gradient(135deg,#f43f5e,#f97316)",
  et:"linear-gradient(135deg,#10b981,#0d9488)",
  ar:"linear-gradient(135deg,#fbbf24,#f43f5e)",
  ip:"linear-gradient(135deg,#4f46e5,#7e22ce)",
  si:"linear-gradient(135deg,#0ea5e9,#4f46e5)",
  pr:"linear-gradient(135deg,#ec4899,#f43f5e)",
  le:"linear-gradient(135deg,#84cc16,#059669)",
  fp:"linear-gradient(135deg,#c026d3,#ec4899)",
  oa:"linear-gradient(135deg,#f97316,#f59e0b)",
  sd:"linear-gradient(135deg,#334155,#0f172a)",
  gb:"linear-gradient(135deg,#1f2937,#000)",
  tc:"linear-gradient(135deg,#2dd4bf,#0891b2)",
  rr:"linear-gradient(135deg,#dc2626,#9f1239)",
  yo:"linear-gradient(135deg,#facc15,#ea580c)",
  bv:"linear-gradient(135deg,#3b82f6,#7c3aed)",
  gl:"linear-gradient(135deg,#22c55e,#a3e635)",
  wh:"linear-gradient(135deg,#f9fafb,#e5e7eb)",
  cr:"linear-gradient(135deg,#fdf4ff,#fce7f3)",
};
// mid colour for bubble swatch
const GR_C = {
  vf:"#9333ea",bc:"#3b82f6",ro:"#fb7185",et:"#10b981",ar:"#f59e0b",
  ip:"#6366f1",si:"#0ea5e9",pr:"#ec4899",le:"#84cc16",fp:"#c026d3",
  oa:"#f97316",sd:"#475569",gb:"#374151",tc:"#2dd4bf",rr:"#dc2626",
  yo:"#facc15",bv:"#3b82f6",gl:"#22c55e",wh:"#e5e7eb",cr:"#f5d0fe",
};

// ─── FONTS ───────────────────────────────────────────────────────────────────
const FONTS = [
  {k:"elegant", l:"Playfair",  c:"'Playfair Display',serif"},
  {k:"lora",    l:"Lora",      c:"'Lora',serif"},
  {k:"dm",      l:"DM Serif",  c:"'DM Serif Display',serif"},
  {k:"display", l:"Inter",     c:"'Inter',sans-serif"},
  {k:"grotesk", l:"Grotesk",   c:"'Space Grotesk',sans-serif"},
  {k:"mono",    l:"Mono",      c:"'Roboto Mono',monospace"},
  {k:"syne",    l:"Syne",      c:"'Syne',sans-serif"},
];
const gfc = k => (FONTS.find(f=>f.k===k)||FONTS[0]).c;

// ─── COLORS ──────────────────────────────────────────────────────────────────
const TC = ["#ffffff","#f8f4ff","#fde68a","#fca5a5","#6ee7b7","#93c5fd","#c4b5fd",
            "#fbcfe8","#374151","#1f2937","#000000","#dc2626","#ea580c","#ca8a04",
            "#16a34a","#2563eb","#7c3aed","#db2777","#0891b2","#0d9488"];
const BC = ["#ffffff","#fde68a","#fca5a5","#6ee7b7","#93c5fd","#c4b5fd","#000000",
            "#1f2937","#dc2626","#ea580c","#ca8a04","#16a34a","#2563eb","#7c3aed",
            "#db2777","#f97316","#10b981","#06b6d4","#8b5cf6","#374151"];

// ─── ELEMENTS ────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const CP=$('cardPreview'), BGL=$('bgLayer'), PT=$('previewTitle'),
      PC=$('previewContent'), PD=$('previewDivider'),
      WME=$('wmEl'), LOV=$('logoOv'), LIM=$('logoImg'),
      CNT=$('counter');

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const c = cards[idx];

  BGL.style.background = GR[c.bg] || GR.vf;

  CP.classList.remove('aspect-1-1','aspect-3-4','aspect-4-3','aspect-16-9','aspect-9-16');
  CP.classList.add(c.aspect);
  CP.style.borderWidth = c.bw==='0' ? '0' : c.bw+'px';
  CP.style.borderStyle = 'solid';
  CP.style.borderColor = c.bc;

  // Title
  PT.textContent = c.title || '';
  PT.style.fontFamily = gfc(c.font);
  PT.style.fontSize   = c.fontSize + 'px';
  PT.style.color      = c.textColor;
  PT.style.textAlign  = c.align;
  PT.style.fontWeight = c.bold   ? '700' : '400';
  PT.style.fontStyle  = c.italic ? 'italic' : 'normal';
  PT.style.lineHeight = c.lineH;

  // Divider
  PD.style.display = c.divider ? 'block' : 'none';

  // Content — inherits same style as title for unified look
  PC.textContent = c.content || '';
  PC.style.fontFamily = gfc(c.font);
  PC.style.fontSize   = Math.max(10, c.fontSize - 10) + 'px';
  PC.style.color      = c.textColor;
  PC.style.textAlign  = c.align;
  PC.style.fontWeight = c.bold   ? '600' : '400';
  PC.style.fontStyle  = c.italic ? 'italic' : 'normal';
  PC.style.lineHeight = c.lineH + 0.1;
  PC.className = c.divider ? '' : 'mt-4 font-medium leading-relaxed';
  PC.style.marginTop = c.divider ? '0' : '';

  WME.textContent   = c.watermark || '';
  WME.style.display = c.watermark ? 'block' : 'none';

  if (c.logo) {
    LIM.src = c.logo; LIM.style.width = c.lsz + 'px';
    LOV.style.left = c.lx + 'px'; LOV.style.top = c.ly + 'px';
    LOV.style.display = 'block';
    $('rmvLogo').style.display = 'block';
  } else {
    LOV.style.display = 'none';
    $('rmvLogo').style.display = 'none';
  }

  const multi = cards.length > 1;
  document.getElementById('cardWrap').classList.toggle('has-multi', multi);
  CNT.style.display = multi ? 'block' : 'none';
  if (multi) CNT.textContent = `${idx+1}/${cards.length}`;
  $('prevBtn').disabled = idx===0;
  $('nextBtn').disabled = idx===cards.length-1;
  renderDots();
}

function renderDots() {
  const d = $('dots'); d.innerHTML = '';
  if (cards.length < 2) return;
  cards.forEach((_,i) => {
    const dot = document.createElement('div');
    const a = i===idx;
    dot.style.cssText = `width:${a?'16px':'6px'};height:6px;border-radius:3px;background:${a?'#6366f1':'#c7d2fe'};transition:all .2s;cursor:pointer;`;
    dot.onclick = () => { idx=i; render(); };
    d.appendChild(dot);
  });
}

// ─── FLOATING BUBBLE PICKER ───────────────────────────────────────────────────
let pickerCloseSlider = false;

function showPicker(items, extraConfig) {
  const pi = $('pickerItems');
  const pe = $('pickerExtra');
  pi.innerHTML = '';

  // Optional slider (for font size)
  if (extraConfig) {
    $('extraLabel').textContent = extraConfig.label;
    const sl = $('extraSlider');
    sl.min = extraConfig.min; sl.max = extraConfig.max; sl.value = extraConfig.value;
    sl.oninput = e => { extraConfig.onChange(+e.target.value); render(); };
    pe.classList.add('show');
  } else {
    pe.classList.remove('show');
  }

  items.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'bubble' + (item.sel ? ' sel' : '') + (item.lbl ? ' lbl' : '');
    if (!item.lbl) btn.style.background = item.color;
    else btn.textContent = item.label;
    btn.onclick = () => { item.action(); hidePicker(); render(); };
    pi.appendChild(btn);
  });

  $('picker').classList.add('show');
}

function hidePicker() {
  $('picker').classList.remove('show');
  $('pickerExtra').classList.remove('show');
}

$('picker').addEventListener('click', e => {
  if (e.target===$('picker') || e.target===$('pickerWrap')) hidePicker();
});

// ─── EDIT SHEET ───────────────────────────────────────────────────────────────
function openEdit() {
  const c = cards[idx];
  $('esTitle').value   = c.title;
  $('esContent').value = c.content;
  $('esWm').value      = c.watermark;
  $('esDivider').checked = c.divider;
  $('editSheet').classList.add('open');
}
function closeEdit() { $('editSheet').classList.remove('open'); }

$('esGrip').onclick = closeEdit;
$('esDone').onclick = closeEdit;

$('esTitle').oninput   = e => { cards[idx].title     = e.target.value; render(); };
$('esContent').oninput = e => { cards[idx].content   = e.target.value; render(); };
$('esWm').oninput      = e => { cards[idx].watermark = e.target.value; render(); };
$('esDivider').onchange= e => { cards[idx].divider   = e.target.checked; render(); };

// ─── LOGO SHEET ───────────────────────────────────────────────────────────────
function openLogo() { $('logoSheet').classList.add('open'); }
function closeLogo() { $('logoSheet').classList.remove('open'); }

$('lsGrip').onclick = closeLogo;
$('lsDone').onclick = closeLogo;
$('upArea').onclick  = () => $('logoFile').click();
$('logoFile').onchange = () => {
  const f = $('logoFile').files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => { Object.assign(cards[idx],{logo:e.target.result,lsz:70,lx:14,ly:14}); render(); closeLogo(); };
  r.readAsDataURL(f);
};
$('logoSzSl').oninput = e => { cards[idx].lsz=+e.target.value; render(); };
$('rmvLogo').onclick  = () => { cards[idx].logo=null; render(); };

document.querySelectorAll('.pos-btn').forEach(b => {
  b.onclick = () => {
    const c=cards[idx], W=CP.offsetWidth, H=CP.offsetHeight, lw=c.lsz;
    const lh = LIM.naturalHeight?(lw/LIM.naturalWidth)*LIM.naturalHeight:lw, pd=12;
    const POS={tl:{x:pd,y:pd},tc:{x:(W-lw)/2,y:pd},tr:{x:W-lw-pd,y:pd},
               ml:{x:pd,y:(H-lh)/2},mc:{x:(W-lw)/2,y:(H-lh)/2},mr:{x:W-lw-pd,y:(H-lh)/2},
               bl:{x:pd,y:H-lh-pd},bc:{x:(W-lw)/2,y:H-lh-pd},br:{x:W-lw-pd,y:H-lh-pd}}[b.dataset.p];
    if(POS){cards[idx].lx=Math.max(0,POS.x);cards[idx].ly=Math.max(0,POS.y);render();}
  };
});

// ─── TOOLBAR ACTIONS ─────────────────────────────────────────────────────────
document.querySelectorAll('[data-a]').forEach(btn => {
  btn.addEventListener('click', () => {
    const a = btn.dataset.a, c = cards[idx];
    hidePicker(); closeEdit(); closeLogo();

    if (a === 'text') {
      openEdit(); return;
    }
    if (a === 'logo') {
      openLogo(); return;
    }
    if (a === 'new') {
      const n = mkCard();
      Object.assign(n,{bg:c.bg,aspect:c.aspect,font:c.font,textColor:c.textColor,
                        bw:c.bw,bc:c.bc,title:'',content:''});
      cards.push(n); idx=cards.length-1; render(); return;
    }

    // ── bubble pickers ──
    if (a === 'bg') {
      showPicker(Object.keys(GR).map(id=>({
        color: GR_C[id], sel: id===c.bg,
        action:()=>{ cards[idx].bg=id; },
      })));
    }
    else if (a === 'color') {
      showPicker(TC.map(col=>({
        color:col, sel:col===c.textColor,
        action:()=>{ cards[idx].textColor=col; },
      })));
    }
    else if (a === 'font') {
      // font name bubbles + size slider
      showPicker(
        FONTS.map(f=>({
          lbl:true, label:f.l, sel:f.k===c.font,
          action:()=>{ cards[idx].font=f.k; },
        })).concat([
          // style toggles as label bubbles
          {lbl:true, label:c.bold?'Bold✓':'Bold', sel:c.bold, action:()=>{ cards[idx].bold=!cards[idx].bold; }},
          {lbl:true, label:c.italic?'Ital✓':'Italic', sel:c.italic, action:()=>{ cards[idx].italic=!cards[idx].italic; }},
          // alignment
          {lbl:true, label:'Left',   sel:c.align==='left',   action:()=>{ cards[idx].align='left'; }},
          {lbl:true, label:'Center', sel:c.align==='center', action:()=>{ cards[idx].align='center'; }},
          {lbl:true, label:'Right',  sel:c.align==='right',  action:()=>{ cards[idx].align='right'; }},
        ]),
        // size slider
        {
          label:'Font Size',
          min:12, max:72, value:c.fontSize,
          onChange:v=>{ cards[idx].fontSize=v; }
        }
      );
    }
    else if (a === 'border') {
      const widths=[['0','None'],['4','Thin'],['8','Med'],['14','Thick']];
      showPicker([
        ...widths.map(([w,l])=>({
          lbl:true, label:l, sel:c.bw===w,
          action:()=>{ cards[idx].bw=w; },
        })),
        ...BC.map(col=>({
          color:col, sel:col===c.bc,
          action:()=>{ cards[idx].bc=col; },
        })),
      ]);
    }
    else if (a === 'ratio') {
      showPicker([
        {lbl:true,label:'1:1',  sel:c.aspect==='aspect-1-1',  action:()=>{ cards[idx].aspect='aspect-1-1'; }},
        {lbl:true,label:'3:4',  sel:c.aspect==='aspect-3-4',  action:()=>{ cards[idx].aspect='aspect-3-4'; }},
        {lbl:true,label:'4:3',  sel:c.aspect==='aspect-4-3',  action:()=>{ cards[idx].aspect='aspect-4-3'; }},
        {lbl:true,label:'16:9', sel:c.aspect==='aspect-16-9', action:()=>{ cards[idx].aspect='aspect-16-9'; }},
        {lbl:true,label:'9:16', sel:c.aspect==='aspect-9-16', action:()=>{ cards[idx].aspect='aspect-9-16'; }},
      ]);
    }
  });
});

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
$('prevBtn').onclick=()=>{ if(idx>0){idx--;render();} };
$('nextBtn').onclick=()=>{ if(idx<cards.length-1){idx++;render();} };
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;
  if(e.key==='ArrowLeft'&&idx>0){idx--;render();}
  if(e.key==='ArrowRight'&&idx<cards.length-1){idx++;render();}
  if(e.key==='Escape'){hidePicker();closeEdit();closeLogo();}
});

// ─── LOGO DRAG ───────────────────────────────────────────────────────────────
(()=>{
  let dr=false,sx,sy,ox,oy;
  const s=e=>{if(e.target.id==='logoRz')return;e.preventDefault();dr=true;const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;ox=cards[idx].lx;oy=cards[idx].ly;};
  const m=e=>{
    if(!dr)return;e.preventDefault();const p=e.touches?e.touches[0]:e;
    const rc=CP.getBoundingClientRect();
    const nx=Math.max(0,Math.min(ox+(p.clientX-sx)*(CP.offsetWidth/rc.width),CP.offsetWidth-(cards[idx].lsz||70)));
    const ny=Math.max(0,Math.min(oy+(p.clientY-sy)*(CP.offsetHeight/rc.height),CP.offsetHeight-20));
    cards[idx].lx=nx;cards[idx].ly=ny;LOV.style.left=nx+'px';LOV.style.top=ny+'px';
  };
  const u=()=>{dr=false;};
  LOV.addEventListener('mousedown',s);LOV.addEventListener('touchstart',s,{passive:false});
  document.addEventListener('mousemove',m);document.addEventListener('touchmove',m,{passive:false});
  document.addEventListener('mouseup',u);document.addEventListener('touchend',u);
})();
(()=>{
  let r=false,sx,ss;
  $('logoRz').addEventListener('mousedown',e=>{e.stopPropagation();r=true;sx=e.clientX;ss=cards[idx].lsz;});
  document.addEventListener('mousemove',e=>{if(!r)return;const ns=Math.max(16,Math.min(ss+(e.clientX-sx),240));cards[idx].lsz=ns;LIM.style.width=ns+'px';$('logoSzSl').value=ns;});
  document.addEventListener('mouseup',()=>{r=false;});
})();

// ─── DOWNLOAD ────────────────────────────────────────────────────────────────
$('dlBtn').addEventListener('click',()=>{
  const hide=[$('dlBtn'),$('prevBtn'),$('nextBtn'),CNT];
  hide.forEach(e=>e.style.visibility='hidden');
  html2canvas(CP,{scale:3,useCORS:true,allowTaint:true,backgroundColor:null,logging:false}).then(canvas=>{
    canvas.toBlob(blob=>{
      const a=document.createElement('a');
      a.download=(cards[idx].title||'flashcard')+'.png';
      a.href=URL.createObjectURL(blob);a.click();
      hide.forEach(e=>e.style.visibility='');
    },'image/png');
  });
});

// ─── INIT ────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
